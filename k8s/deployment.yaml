
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fsd-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fsd-project
  template:
    metadata:
      labels:
        app: fsd-project
    spec:
      containers:
        - name: fsd-project
          image: aryan04batra/fsd-project:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
