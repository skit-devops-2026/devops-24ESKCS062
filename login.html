<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WarrantyVault</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      
      <div class="auth-header">
        <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 0.5rem;">
          🛡️ <span>WarrantyVault</span>
        </a>
        <h2>Welcome Back</h2>
        <p>Sign in to manage your warranties & receipts</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="user@example.com" required value="user@example.com">
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required value="password123">
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; font-size: 0.88rem;">
          <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; margin-bottom: 0;">
            <input type="checkbox" id="rememberMe" checked> Remember me
          </label>
          <a href="#" onclick="alert('Demo Mode: Use password123 to log in.')">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Login to Dashboard</button>
      </form>

      <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--border-color); text-align: center; font-size: 0.85rem;">
        <span style="color: var(--text-muted);">Quick Demo Links:</span>
        <div style="margin-top: 0.4rem; display: flex; justify-content: center; gap: 1rem;">
          <a href="user/dashboard.html" style="font-weight: 600;">➔ User Demo</a>
          <a href="admin/dashboard.html" style="color: var(--secondary); font-weight: 600;">➔ Admin Demo</a>
        </div>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="register.html" style="font-weight: 600;">Register Here</a>
      </div>

    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
